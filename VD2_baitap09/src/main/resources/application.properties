server.port=8080
spring.thymeleaf.cache=false

# Connection String SQL Server (sa / 1234567@a$) + Tự động tạo Database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=springboot_sec_ex2;encrypt=false;trustServerCertificate=true;createDatabaseIfNotExist=true;
spring.datasource.username=sa
spring.datasource.password=1234567@a$
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Config
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
